# AMPS Backend Configuration
# All values can be overridden by environment variables

ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = ["dev.amps.backend.ApplicationKt.module"]
    }
}

database {
    # Railway provides DATABASE_URL like: postgresql://user:pass@host:port/dbname
    # If not set, falls back to individual params
    url = ${?DATABASE_URL}
    driver = "org.postgresql.Driver"
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
    pool {
        maximumSize = 10
        minimumIdle = 2
    }
}

jwt {
    secret = ${?JWT_SECRET}  # Required: base64-encoded 256-bit key
    issuer = "amps-backend"
    audience = "amps-app"
    accessTokenExpiryMinutes = 30
    refreshTokenExpiryDays = 30
}

email {
    # Resend API (preferred) - set RESEND_API_KEY
    resendApiKey = ${?RESEND_API_KEY}
    from = ${?EMAIL_FROM}  # e.g., "AMPS <noreply@yourdomain.com>"
    # SMTP fallback (if no Resend key)
    smtp {
        host = ${?SMTP_HOST}
        port = ${?SMTP_PORT}  # 587
        user = ${?SMTP_USER}
        password = ${?SMTP_PASSWORD}
        useTls = true
    }
}

sms {
    # Twilio
    accountSid = ${?TWILIO_ACCOUNT_SID}
    authToken = ${?TWILIO_AUTH_TOKEN}
    fromNumber = ${?TWILIO_FROM_NUMBER}  # e.g., "+15551234567"
}

app {
    # Frontend (Android) base URL for links in emails
    frontendBaseUrl = ${?FRONTEND_BASE_URL}  # e.g., "https://amps.app"
    # Verification code length
    codeLength = 6
    codeExpiryMinutes = 10
}

cors {
    allowedOrigins = ["*"]  # Configure properly for production
}